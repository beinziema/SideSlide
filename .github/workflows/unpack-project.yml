name: Unpack Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf app gradle
          rm -f build.gradle.kts gradle.properties gradlew gradlew.bat settings.gradle.kts
          unzip -o sideslide-codemagic.zip

      - name: Remove ZIP
        run: rm -f sideslide-codemagic.zip

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unpack SideSlide Android project" || echo "Nothing to commit"
          git push
